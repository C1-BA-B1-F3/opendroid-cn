name: Release APK

# opendroid-cn：构建「已签名」的 release APK 并发布到 GitHub Releases。
#
# 触发方式
#   - 推送 v* 标签  → 构建 + 校验签名 + 创建 Release 并上传 APK
#   - 手动 workflow_dispatch → 仅构建 + 校验签名（不创建 Release），用于验证密钥配置
#
# 所需 Secrets（仓库级）
#   RELEASE_KEYSTORE_BASE64  keystore 文件的 base64
#   RELEASE_STORE_PASSWORD   keystore 口令
#   RELEASE_KEY_ALIAS        密钥别名
#   RELEASE_KEY_PASSWORD     密钥口令
#
# 说明：app/build.gradle 已内置 release 签名逻辑，凭据从 ORG_GRADLE_PROJECT_*
# 环境变量读取，keystore 需放在仓库根目录（该文件被 .gitignore 排除，不入库）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 未配置，无法签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > opendroid-release.keystore
          ls -l opendroid-release.keystore

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::未找到 release APK"; exit 1; fi
          echo "APK: $APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ]; then
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            "$BT/aapt2" dump badging "$APK" | grep -E "^package|application-label|sdkVersion|targetSdkVersion" || true
          else
            echo "::warning::未找到 build-tools，跳过签名校验"
          fi

      - name: Stage artifact
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp "$APK" "dist/OpenDroid-CN-${TAG}.apk"
          (cd dist && sha256sum "OpenDroid-CN-${TAG}.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendroid-cn-release-apk
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          非官方中文分支（opendroid-cn），仅通过 GitHub 提供 APK，自用与交流分享，非商用。
          与上游 OpenDroid 项目无任何关联。

          - 界面已中文化（运行时翻译层，未改动上游业务逻辑）
          - 基于上游 yashab-cyber/opendroid（Apache-2.0），详见 NOTICE
          - 本构建使用本分支自签证书签名；后续升级安装需保持同一签名
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenDroid 中文版 $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
